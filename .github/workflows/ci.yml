name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Typecheck workspaces
        run: >
          bun run
          --sequential
          --workspaces
          --if-present
          typecheck

      - name: Test API
        run: bun --filter './apps/api' test

      - name: Test web
        run: bun --filter './apps/web' test

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:17-alpine
  
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_app_test
  
        ports:
          - 5432:5432
  
        options: >-
          --health-cmd "pg_isready -U postgres -d my_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_app_test
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
  
      - name: Install dependencies
        run: bun ci
  
      - name: Show database target
        run: |
          bun --no-env-file -e "
            const url = new URL(process.env.DATABASE_URL);
            console.log({
              host: url.hostname,
              port: url.port,
              database: url.pathname
            });
          "
  
      - name: Run database migrations
        run: bun --cwd apps/api --no-env-file run db:migrate
  
      - name: Run API integration tests
        run: bun --cwd apps/api --no-env-file test src/test/integration