name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
  
      - name: Install dependencies
        run: bun ci

      - name: Lint and format check
        run: bun run biome:check
  
      - name: Typecheck
        run: >
          bun run
          --sequential
          --workspaces
          --if-present
          typecheck
  
      - name: Test API unit with coverage
        run: bun run --cwd apps/api test:coverage
  
      - name: Test web with coverage
        run: bun run --cwd apps/web test:coverage

      - name: Build web
        run: bun --filter './apps/web' build

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:17-alpine
  
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_app_test
  
        ports:
          - 5432:5432
  
        options: >-
          --health-cmd "pg_isready -U postgres -d my_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    env:
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_app_test
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
  
      - name: Install dependencies
        run: bun ci
  
      - name: Inspect migrations
        working-directory: apps/api
        run: |
          echo "Migration files:"
          find drizzle -type f -print
  
          echo "Users migration:"
          grep -R 'CREATE TABLE "users"' drizzle || true
  
      - name: Run migrations
        working-directory: apps/api
        run: bun --no-env-file run db:migrate

      - name: Verify migrated database
        working-directory: apps/api
        run: bun --no-env-file scripts/check-test-db.ts
  
      - name: Run integration tests
        working-directory: apps/api
        run: bun --no-env-file test src/test/integration
        
  publish-images:
    name: Publish Images

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - quality
      - api-integration

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: runtime
          push: true

          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Migration image metadata
        id: migrate-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-migrate
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      
      - name: Build and push migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: migrate
          push: true
      
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
      
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true

          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}

          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web      