name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
  
      - name: Install dependencies
        run: bun ci
  
      - name: Typecheck
        run: >
          bun run
          --sequential
          --workspaces
          --if-present
          typecheck
  
      - name: Test API unit
        run: bun --filter './apps/api' test:unit
  
      - name: Test web
        run: bun --filter './apps/web' test

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:17-alpine
  
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_app_test
  
        ports:
          - 5432:5432
  
        options: >-
          --health-cmd "pg_isready -U postgres -d my_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/my_app_test
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
  
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
  
      - name: Install dependencies
        run: bun ci
  
      - name: Inspect migrations
        working-directory: apps/api
        run: |
          echo "Migration files:"
          find drizzle -type f -print
  
          echo "Users migration:"
          grep -R 'CREATE TABLE "users"' drizzle || true
  
      - name: Run migrations
        working-directory: apps/api
        run: bun --no-env-file run db:migrate

      - name: Verify migrated database
        working-directory: apps/api
        run: bun --no-env-file scripts/check-test-db.ts
  
      - name: Run integration tests
        working-directory: apps/api
        run: bun --no-env-file test src/test/integration